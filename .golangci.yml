version: "2"
run:
  tests: true
linters:
  enable:
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G204 # Subprocess launched with variable (needed for player launcher)
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/manojpannala/torbox-trakt-wrapper
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
