run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gofmt
    - goimports
    - misspell
    - unconvert
    - revive

linters-settings:
  goimports:
    local-prefixes: github.com/manojpannala/torbox-trakt-wrapper
  govet:
    enable-all: true
    disable:
      - fieldalignment
  gosec:
    excludes:
      - G204 # Subprocess launched with variable (needed for player launcher)
  revive:
    rules:
      - name: exported
        disabled: true
      - name: package-comments
        disabled: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
