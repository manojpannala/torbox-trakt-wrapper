version: 2

project_name: tt-wrapper

before:
  hooks:
    - go mod tidy

builds:
  - id: tt-wrapper
    main: ./cmd/tt-wrapper
    binary: tt-wrapper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/manojpannala/torbox-trakt-wrapper/pkg/config.Version={{ .Version }}
      - -X github.com/manojpannala/torbox-trakt-wrapper/pkg/config.Commit={{ .Commit }}
      - -X github.com/manojpannala/torbox-trakt-wrapper/pkg/config.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  header: |
    A terminal wrapper around TorBox and Trakt.tv: browse your TorBox library
    in a TUI, stream straight to mpv, and scrobble playback to Trakt as you watch.

    ### Install

    Download the archive for your platform below, extract it, and put `tt-wrapper`
    on your `PATH`.

    ### First run

    ```
    tt-wrapper config init
    tt-wrapper auth torbox <your-torbox-api-key>
    tt-wrapper auth trakt
    tt-wrapper
    ```

    Trakt auth needs a Trakt application (https://trakt.tv/oauth/applications) with
    its redirect URI set to `urn:ietf:wg:oauth:2.0:oob`; put the client ID and secret
    in your config before running `auth trakt`.

changelog:
  sort: asc
  use: git
  abbrev: -1
  groups:
    - title: '🚀 Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: '🐛 Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: '⚡ Performance'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: '♻️ Refactoring'
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: '🧰 Maintenance & Dependencies'
      regexp: '^.*?chore(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: '📝 Documentation'
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: 'Others'
      order: 999
  filters:
    exclude:
      - '^typo'
      - '^test:'
