version: 2

project_name: tt-wrapper

before:
  hooks:
    - go mod tidy

builds:
  - id: tt-wrapper
    main: ./cmd/tt-wrapper
    binary: tt-wrapper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/manojpannala/torbox-trakt-wrapper/pkg/config.Version={{ .Version }}
      - -X github.com/manojpannala/torbox-trakt-wrapper/pkg/config.Commit={{ .Commit }}
      - -X github.com/manojpannala/torbox-trakt-wrapper/pkg/config.Date={{ .Date }}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
